services:
  - type: worker
    name: discord-grok-listener
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./listener
    dockerfilePath: ./listener/Dockerfile
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_WAKE_URL
        sync: false
      - key: DISCORD_WAKE_KEY
        sync: false
      - key: BOT_USER_ID
        sync: false
      - key: DATA_DIR
        value: /tmp/data
