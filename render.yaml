services:
  - type: web
    name: discord-grok-listener
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./listener
    dockerfilePath: ./listener/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_WAKE_URL
        sync: false
      - key: DISCORD_WAKE_KEY
        sync: false
      - key: BOT_USER_ID
        sync: false
      - key: LISTENER_API_KEY
        sync: false
      - key: DASHBOARD_URL
        value: https://discord-grok-bridge.vercel.app
      - key: LISTENER_SOURCE
        value: render
      - key: DATA_DIR
        value: /tmp/data
